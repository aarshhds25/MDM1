<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #007bff;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 15px;
      padding: 10px;
      background: #e9ecef;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Grade Calculator</h2>
    <label>Marks in Subject 1:</label>
    <input type="number" id="sub1" placeholder="Enter marks">
    
    <label>Marks in Subject 2:</label>
    <input type="number" id="sub2" placeholder="Enter marks">
    
    <label>Marks in Subject 3:</label>
    <input type="number" id="sub3" placeholder="Enter marks">
    
    <button onclick="calculateGrade()">Calculate</button>
    
    <div class="result" id="output"></div>
  </div>

  <script>
    function calculateGrade() {
      let s1 = parseFloat(document.getElementById("sub1").value) || 0;
      let s2 = parseFloat(document.getElementById("sub2").value) || 0;
      let s3 = parseFloat(document.getElementById("sub3").value) || 0;

      let total = s1 + s2 + s3;
      let percentage = (total / 300) * 100; // मान लो हर subject 100 marks का है
      let grade = "";

      if (percentage >= 90) grade = "A+";
      else if (percentage >= 75) grade = "A";
      else if (percentage >= 60) grade = "B";
      else if (percentage >= 45) grade = "C";
      else grade = "Fail";

      document.getElementById("output").innerHTML = `
        <strong>Total Marks:</strong> ${total} <br>
        <strong>Percentage:</strong> ${percentage.toFixed(2)}% <br>
        <strong>Grade:</strong> ${grade}
      `;
    }
  </script>
</body>
</html>
